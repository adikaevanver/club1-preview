<!doctype html>
<html lang="ru" class="v-site">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1">
<meta name="theme-color" content="#0a0810">
<meta name="robots" content="noindex, nofollow">
<title>Тест полосы статус-бара — 2</title>
<link rel="stylesheet" href="styles.css?v=2608222">
<style>
  /* Страница повторяет шапку сайта один в один (те же классы, тот же
     styles.css) и сама переключает варианты раз в 4 секунды. Задача —
     увидеть, при каком варианте полоса статус-бара перестаёт показывать
     проехавший контент. */
  .lab{position:fixed;top:74px;left:0;right:0;z-index:140;
       padding:10px 14px;background:#ff2d2d;color:#fff;
       font:700 17px/1.3 -apple-system, system-ui, sans-serif}
  .lab small{display:block;font-weight:500;font-size:12px;opacity:.9;
             font-family:ui-monospace, Menlo, monospace}
  .strip{padding:0}
  .strip div{height:110px;display:flex;align-items:center;padding-left:16px;
             font:700 22px/1 -apple-system, system-ui, sans-serif;color:#000}

  /* ── варианты ────────────────────────────────────────────────────── */
  /* 1 · как сейчас на сайте: фон на потомке шапки — ничего не меняем */

  /* 2 · фон возвращён на саму шапку (как было до правки) */
  .v-onself .site-header__bg{display:none}
  .v-onself .site-header.is-scrolled{background:var(--ink)}

  /* 3 · фон потомка задан сразу, без класса is-scrolled */
  .v-static .site-header__bg{opacity:1}

  /* 4 · без рамки и тени у шапки */
  .v-plain .site-header.is-scrolled{box-shadow:none;border-bottom-color:transparent}

  /* 5 · html и body без overflow-x:clip */
  .v-noclip, .v-noclip body{overflow-x:visible}
</style>
</head>
<body>

<header class="site-header is-scrolled" id="siteHeader">
  <div class="site-header__bg" aria-hidden="true"></div>
  <div class="container site-header__inner">
    <a class="logo" href="./" aria-label="CLUB 1">
      <img src="assets/logo-white.svg" alt="CLUB 1" width="1229" height="219">
    </a>
    <div class="header-actions">
      <button class="burger" id="burger" aria-label="Меню"><span></span></button>
    </div>
  </div>
</header>

<div class="lab" id="lab">вариант…</div>

<div class="strip" id="strip"></div>

<script>
  /* лента: яркие плашки вперемешку с настоящими афишами — на сайте за
     полосу статус-бара просвечивают именно карточки с картинками */
  var strip = document.getElementById('strip');
  var colors = ['#ffd400','#ff7ad9','#7affd4','#ffa14a','#a6c1ff'];
  var posters = ['beauty-45-640.jpg','burlesk-1007-sq-640.jpg'];
  for (var i = 0; i < 60; i++) {
    var d = document.createElement('div');
    if (i % 3 === 2) {
      d.style.padding = '0';
      var img = document.createElement('img');
      img.src = 'assets/posters/' + posters[(i / 3 | 0) % posters.length];
      img.style.cssText = 'width:100%;height:110px;object-fit:cover;display:block';
      d.appendChild(img);
    } else {
      d.style.background = colors[i % colors.length];
      d.textContent = 'ЛЕНТА ' + (i + 1);
    }
    strip.appendChild(d);
  }

  /* шапка ведёт себя как на сайте */
  var header = document.getElementById('siteHeader');
  window.addEventListener('scroll', function(){
    header.classList.toggle('is-scrolled', window.scrollY > 24);
  }, {passive:true});

  var VARIANTS = [
    ['v-site',   '1 · КАК СЕЙЧАС НА САЙТЕ'],
    ['v-onself', '2 · ФОН НА САМОЙ ШАПКЕ'],
    ['v-static', '3 · ФОН ПОТОМКА ЗАДАН СРАЗУ'],
    ['v-plain',  '4 · БЕЗ РАМКИ И ТЕНИ'],
    ['v-noclip', '5 · HTML/BODY БЕЗ CLIP']
  ];
  var lab = document.getElementById('lab');
  var n = 0;

  function apply(){
    var v = VARIANTS[n % VARIANTS.length];
    VARIANTS.forEach(function(x){ document.documentElement.classList.remove(x[0]); });
    document.documentElement.classList.add(v[0]);
    lab.innerHTML = v[1] + '<small>прокрути и смотри полосу над логотипом · scrollY ' +
      Math.round(window.scrollY) + '</small>';
    n++;
  }
  apply();
  setInterval(apply, 4000);
</script>
</body>
</html>
