<style>
@font-face{font-family:'Manrope';font-weight:400;font-display:swap;src:url(/fonts/Manrope-normal-400-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-weight:400;font-display:swap;src:url(/fonts/Manrope-normal-400-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:'Manrope';font-weight:600;font-display:swap;src:url(/fonts/Manrope-normal-600-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-weight:600;font-display:swap;src:url(/fonts/Manrope-normal-600-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:'Cormorant Garamond';font-weight:600;font-display:swap;src:url(/fonts/CormorantGaramond-normal-600-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Cormorant Garamond';font-weight:600;font-display:swap;src:url(/fonts/CormorantGaramond-normal-600-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-display:swap;src:url(/fonts/CormorantGaramond-italic-500-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
:root{--bg:#07050a;--bg2:#120c14;--line:#3a2d1f;--gold:#D4AF37;--gold2:#F0D98A;--cream:#F3E9D8;--muted:#b7aa98;--err:#ff8f8f;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 60% at 50% 0%,#24160f 0%,var(--bg) 60%) fixed,var(--bg);color:var(--cream);font:400 16px/1.5 var(--sans);min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:28px 16px calc(40px + env(safe-area-inset-bottom))}
.logo{display:block;height:54px;margin:0 auto 18px}
.kicker{text-align:center;font:600 12px/1.6 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold2)}
h1{text-align:center;font:600 36px/1.05 var(--serif);margin:8px 0 10px}
h1 em{font-style:italic;font-weight:500;color:var(--gold2)}
.lede{text-align:center;color:var(--muted);font-size:15px;margin-bottom:22px}
form{display:grid;gap:14px}
label.f{display:grid;gap:6px;font-size:13px;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],select{width:100%;font:400 17px/1.3 var(--sans);color:var(--cream);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 14px;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--gold2) 50%),linear-gradient(135deg,var(--gold2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
input:focus,select:focus{border-color:var(--gold)}
.drinks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drinks label{display:block;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:14px;cursor:pointer}
.drinks input{position:absolute;opacity:0}
.drinks input:checked+span{color:var(--gold2)}
.drinks label:has(input:checked){border-color:var(--gold)}
.chk{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:12.5px;line-height:1.45;color:var(--muted);align-items:start}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--gold)}
.chk a{color:var(--gold2)}
.btn{margin-top:4px;width:100%;border:0;border-radius:999px;padding:16px;font:600 15px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#1a1208;background:linear-gradient(100deg,#c99a35,#f3dc95 45%,#c99a35);cursor:pointer}
.btn[disabled]{opacity:.6}
.err{color:var(--err);font-size:14px;min-height:1.2em;text-align:center}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{text-align:center}
.done .ok{font:600 13px/1.6 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold2)}
.done .code{font:600 88px/1 var(--sans);letter-spacing:.12em;margin:14px 0 6px;background:linear-gradient(100deg,#c99a35,#fff2c4 40%,#d4ae4c 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.done .who{font:600 26px/1.2 var(--serif)}
.done .meta{color:var(--muted);margin-top:4px}
.done .show{margin-top:22px;border:1px solid var(--gold);border-radius:16px;padding:16px;font-size:17px}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <img class="logo" src="/assets/logo-metelitsa.png" alt="Метелица · Клуб №1" width="105" height="54">

  <section id="formBox">
    <p class="kicker">Клуб гостей Метелицы</p>
    <h1>Велком <em>за&nbsp;знакомство</em></h1>
    <p class="lede">«О чём молчат женщины» — вступите в клуб гостей и получите личный код на велком.</p>

    <form id="klub" novalidate>
      <label class="f">Имя
        <input type="text" name="name" autocomplete="given-name" required maxlength="60">
      </label>
      <label class="f">Телефон
        <input type="tel" name="phone" inputmode="tel" autocomplete="tel" placeholder="+7 (___) ___-__-__" required>
      </label>
      <label class="f">Ваш стол
        <select name="table" id="table" required><option value="">Выберите стол</option></select>
      </label>
      <div class="f" id="drinkBox" hidden>
        <span class="f">Коктейль</span>
        <div class="drinks" id="drinks"></div>
      </div>
      <label class="f">Email — по желанию
        <input type="email" name="email" autocomplete="email" maxlength="120">
      </label>
      <label class="chk"><input type="checkbox" name="consent_pd" required>
        <span>Я даю согласие ООО «Продюсерский центр Клуб Номер Один» (ИНН&nbsp;9704127352) на обработку моих персональных данных (имя, телефон, email, номер стола, выбранный напиток и дата визита) для участия в клубе гостей Метелицы, выдачи велком-напитка и связи по моему визиту — в соответствии с <a href="/privacy#klub" target="_blank">политикой обработки персональных данных</a>. Согласие действует до отзыва; отозвать — письмом на Club1promo@yandex.ru.</span>
      </label>
      <label class="chk"><input type="checkbox" name="consent_ads">
        <span>Хочу получать сообщения о премьерах, событиях и акциях Метелицы по SMS, в мессенджерах и по email. Отписаться можно в любой момент.</span>
      </label>
      <div class="hp" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>
      <button class="btn" type="submit" id="go">Получить код</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </section>

  <section id="doneBox" class="done" hidden>
    <p class="ok">Велком подтверждён</p>
    <div class="code" id="dCode">0000</div>
    <div class="who" id="dName"></div>
    <div class="meta" id="dMeta"></div>
    <div class="show">Покажите этот экран хостес</div>
  </section>

  <p class="foot">Метелица · Новый Арбат, 21 · 18+</p>
</main>

<script>
(function () {
  'use strict';
  /* шаг 2: список коктейлей пришлёт команда — [{code:'c1', name:'…', img:'/img/klub/c1.jpg'}, …] */
  var DRINKS = [];
  var KEY = 'klub-code-' + new Date().toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow' });
  var TABLES = [];
  for (var i = 1; i <= 13; i++) TABLES.push(['vip' + i, 'VIP ' + i]);
  for (i = 1; i <= 71; i++) TABLES.push(['s' + i, 'Стол ' + i]);
  for (i = 1; i <= 4; i++) TABLES.push(['d' + i, 'Диван ' + i]);
  TABLES.push(['bar', 'Бар']);
  var NAMES = {}; TABLES.forEach(function (t) { NAMES[t[0]] = t[1]; });

  var sel = document.getElementById('table');
  TABLES.forEach(function (t) { var o = document.createElement('option'); o.value = t[0]; o.textContent = t[1]; sel.appendChild(o); });
  var preset = new URLSearchParams(location.search).get('t');
  if (preset && NAMES[preset]) sel.value = preset;

  if (DRINKS.length) {
    document.getElementById('drinkBox').hidden = false;
    var box = document.getElementById('drinks');
    DRINKS.forEach(function (d) {
      var l = document.createElement('label');
      l.innerHTML = (d.img ? '<img src="' + d.img + '" alt="" style="width:100%;border-radius:8px;margin-bottom:6px">' : '') +
        '<input type="radio" name="drink" value="' + d.code + '"><span></span>';
      l.querySelector('span').textContent = d.name;
      box.appendChild(l);
    });
  }
  var DRINK_NAMES = {}; DRINKS.forEach(function (d) { DRINK_NAMES[d.code] = d.name; });

  /* маска телефона +7 */
  var ph = document.querySelector('[name=phone]');
  function digits(v) { var d = v.replace(/\D/g, ''); if (d[0] === '8' || d[0] === '7') d = d.slice(1); return d.slice(0, 10); }
  function fmt(d) {
    var s = '+7';
    if (d.length) s += ' (' + d.slice(0, 3);
    if (d.length >= 3) s += ')';
    if (d.length > 3) s += ' ' + d.slice(3, 6);
    if (d.length > 6) s += '-' + d.slice(6, 8);
    if (d.length > 8) s += '-' + d.slice(8, 10);
    return s;
  }
  ph.addEventListener('input', function () { ph.value = fmt(digits(ph.value)); });
  ph.addEventListener('focus', function () { if (!ph.value) ph.value = '+7 '; });

  function goal(n, p) { try { if (window.ym) window.ym(111571199, 'reachGoal', n, p || {}); } catch (e) {} }

  function show(r) {
    document.getElementById('formBox').hidden = true;
    document.getElementById('doneBox').hidden = false;
    document.getElementById('dCode').textContent = r.code;
    document.getElementById('dName').textContent = r.name;
    document.getElementById('dMeta').textContent = [NAMES[r.table] || r.table, DRINK_NAMES[r.drink] || '', r.date].filter(Boolean).join(' · ');
    window.scrollTo(0, 0);
  }
  try { var saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved && saved.code) show(saved); } catch (e) {}

  var form = document.getElementById('klub'), err = document.getElementById('err'), go = document.getElementById('go');
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    err.textContent = '';
    var f = form.elements;
    var data = {
      name: f.name.value.trim(), phone: '+7' + digits(ph.value), table: f.table.value,
      email: f.email.value.trim(), drink: (form.querySelector('[name=drink]:checked') || {}).value || '',
      consent_pd: f.consent_pd.checked, consent_ads: f.consent_ads.checked, website: f.website.value,
      src: new URLSearchParams(location.search).get('src') || ''
    };
    if (!data.name) return (err.textContent = 'Укажите имя');
    if (digits(ph.value).length !== 10) return (err.textContent = 'Проверьте номер телефона');
    if (!data.table) return (err.textContent = 'Выберите стол');
    if (DRINKS.length && !data.drink) return (err.textContent = 'Выберите коктейль');
    if (!data.consent_pd) return (err.textContent = 'Нужно согласие на обработку данных');
    go.disabled = true;
    fetch('/klub/reg.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        go.disabled = false;
        if (!r.ok) { err.textContent = r.error || 'Не получилось, обратитесь к хостес'; return; }
        try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {}
        if (!r.repeat) goal('klub_reg', { table: r.table, drink: r.drink || '' });
        show(r);
      })
      .catch(function () { go.disabled = false; err.textContent = 'Нет связи. Попробуйте ещё раз или обратитесь к хостес'; });
  });
})();
</script>
</body>
</html>
